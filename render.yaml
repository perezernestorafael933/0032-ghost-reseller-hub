# Render Blueprint for Jules Auto-Deploy & Preview Environments
# Author: Perez, Ernesto Rafael ("Rafa") & Angelus AGI
# Repo: 0032-ghost-reseller-hub

services:
  - type: web
    name: 0032-ghost-reseller-hub
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PORT
        value: 10000
